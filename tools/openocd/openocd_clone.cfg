# STM32F103C8T6 (Blue Pill / compatible clone) + ST-LINK/V2
# Non-destructive OpenOCD GDB server configuration.
# OpenOCD alone does NOT erase or program flash with this file.
# GDB/CubeIDE can program flash after a user explicitly starts debugging.

adapter driver st-link
# VID:PID pairs used by common ST-LINK variants. For a very old
# probe firmware, dapdirect_swd may be unsupported.
st-link vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754 0x0483 0x3755 0x0483 0x3757
transport select dapdirect_swd

# Start conservatively on less tolerant F103-compatible chips.
adapter speed 100

set _CHIPNAME stm32f103c8
set _ENDIAN little
swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap

$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x5000 -work-area-backup 0
flash bank $_CHIPNAME.flash stm32f1x 0x08000000 0 0 0 $_CHIPNAME.cpu

# No reset wire is required for ordinary four-wire SWD connections.
reset_config none

# CubeIDE's GDB Hardware Debugging connects here.
gdb_port 3333
